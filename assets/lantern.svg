<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 240">
  <defs>
    <!-- Radiant Inner Glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FFD54F" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#FF6F00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D81B60" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="streamerPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="streamerGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
  </defs>

  <!-- Hanging Thread -->
  <line x1="50" y1="0" x2="50" y2="35" stroke="#FFD700" stroke-width="1.8"/>

  <!-- Top Ring -->
  <circle cx="50" cy="35" r="4" fill="#FFD700"/>

  <!-- Main Diamond Geometric Body of Kandil -->
  <g transform="translate(50, 85)">
    <!-- Glow aura -->
    <circle cx="0" cy="0" r="45" fill="#FF9E1B" opacity="0.3" filter="blur(6px)"/>
    
    <!-- Outer Diamond -->
    <polygon points="0,-48 44,0 0,48 -44,0" fill="url(#lanternGlow)" stroke="#FFD700" stroke-width="2.5"/>
    
    <!-- Inner Mirror Patterns -->
    <polygon points="0,-32 30,0 0,32 -30,0" fill="#880E4F" opacity="0.45"/>
    <polygon points="0,-18 16,0 0,18 -16,0" fill="#FFF59D"/>

    <!-- Corner Star Prisms -->
    <polygon points="0,-48 -10,-32 0,-36 10,-32" fill="#FFD700"/>
    <polygon points="0,48 -10,32 0,36 10,32" fill="#FFD700"/>
    <polygon points="-44,0 -32,-10 -36,0 -32,10" fill="#FFD700"/>
    <polygon points="44,0 32,-10 36,0 32,10" fill="#FFD700"/>
  </g>

  <!-- Hanging Paper Streamers / Ribbons (Tassels) -->
  <g stroke-linecap="round">
    <path d="M26,133 Q22,170 24,215" stroke="url(#streamerPink)" stroke-width="3" fill="none"/>
    <path d="M34,133 Q38,175 32,225" stroke="url(#streamerGold)" stroke-width="3.5" fill="none"/>
    <path d="M42,133 Q40,180 44,235" stroke="url(#streamerPink)" stroke-width="4" fill="none"/>
    <path d="M50,133 Q52,185 50,240" stroke="#FFD700" stroke-width="4.5" fill="none"/>
    <path d="M58,133 Q56,180 60,235" stroke="url(#streamerPink)" stroke-width="4" fill="none"/>
    <path d="M66,133 Q62,175 68,225" stroke="url(#streamerGold)" stroke-width="3.5" fill="none"/>
    <path d="M74,133 Q78,170 76,215" stroke="url(#streamerPink)" stroke-width="3" fill="none"/>
  </g>
</svg>
